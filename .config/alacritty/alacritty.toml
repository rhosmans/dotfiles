# Alacritty dotfile
# github.com/rhosmans 
# August 2025

[general]
working_directory = "~"
import = [
  "~/.config/alacritty/mapping.toml",
  "~/.config/alacritty/theme.toml",
]

[env]
TERM = "xterm-256color"

[window]
opacity = 0.95
decorations = "Buttonless"
option_as_alt = "OnlyLeft"
padding = { x = 10, y = 10 }
dynamic_padding = true

[font]
size = 12.0

[font.normal]
family = "CaskaydiaMono Nerd Font Propo"
style = "Regular"

[font.bold]
family = "CaskaydiaMono Nerd Font Propo"
style = "Bold"

[font.italic]
family = "CaskaydiaMono Nerd Font Propo"
style = "Italic"

[font.bold_italic]
family = "CaskaydiaMono Nerd Font Propo"
style = "Bold Italic"

[mouse]
hide_when_typing = true

