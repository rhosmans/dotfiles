# Use vim keybindings in Tmux 
setw -g mode-keys vi 

# Set prefix key to Ctrl-a instead of Ctrl-b
unbind C-b 
set-option -g prefix C-a 
bind-key C-a send-prefix

# Enable mouse mode
set -g mouse on

# reload tmux config prefix + r 
bind r source-file ~/.config/tmux/.tmux.conf \; display-message "Config reloaded!" 

set -g @plugin 'christoomey/vim-tmux-navigator'

# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'christoomey/vim-tmux-navigator'

# Keybindings for vim-tmux-navigator
set -g @vim_navigator_mapping_left "C-Left C-h"  # use C-h and C-Left
set -g @vim_navigator_mapping_right "C-Right C-l"
set -g @vim_navigator_mapping_up "C-k"
set -g @vim_navigator_mapping_down "C-j"
set -g @vim_navigator_mapping_prev ""  # removes the C-\ binding

# Clear screen + scrollback on prefix+Ctrl+k (Alacritty sends this on Cmd+k).
# send-keys C-l goes straight to the shell (bypasses vim-tmux-navigator),
# the short sleep lets the prompt redraw before the history is wiped.
bind C-k send-keys C-l \; run-shell "sleep 0.15" \; clear-history

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'
